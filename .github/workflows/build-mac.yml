name: Build macOS app

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build .dmg
        run: npm run dist

      - name: Upload .dmg as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: unlethargic-dmg
          path: dist/*.dmg
